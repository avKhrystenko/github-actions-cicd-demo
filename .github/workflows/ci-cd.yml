name: Build, test, release and deploy

'on':
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-release-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    env:
      APP_ENV: ${{ vars.APP_ENV }}

    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v4

      - name: Налаштувати Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Перевірити змінну середовища
        run: |
          echo "Режим застосунку: $APP_ENV"

      - name: Зібрати проєкт
        run: npm run build

      - name: Запустити автоматизовані тести
        run: npm test

      - name: Налаштувати GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Підготувати файли сайту
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Створити реліз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Опублікувати сайт
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
