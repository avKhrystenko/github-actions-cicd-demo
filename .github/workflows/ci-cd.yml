name: Build, test and deploy

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v4

      - name: Налаштувати Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Зібрати проєкт
        run: npm run build

      - name: Запустити автоматизовані тести
        run: npm test

      - name: Налаштувати GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Завантажити файли сайту
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Опублікувати сайт
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
